<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171329;font-family:Arial,sans-serif}
  .controls{display:flex;gap:14px;justify-content:center;align-items:center}
  button{border:0;border-radius:10px;padding:14px 26px;font-size:18px;font-weight:700;cursor:pointer}
  #start{background:#28a745;color:#fff}
  #stop{background:#dc3545;color:#fff}
</style>
</head>
<body>
<div class="controls">
  <button id="start" type="button">Start</button>
  <button id="stop" type="button">Stop</button>
</div>
<script>
(() => {
  let ctx=null, master=null, running=false, timer=null;
  function tone(freq,t,d,type='sine',vol=.1,end=null){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(end!==null)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.025);
    g.gain.setValueAtTime(vol,t+Math.max(.04,d-.05));
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
  }
  function laugh(t){for(let i=0;i<7;i++)tone(430+(i%3)*95,t+i*.16,.12,'triangle',.10,650+(i%2)*100)}
  function cry(t){for(let i=0;i<4;i++)tone(720-i*55,t+i*.48,.38,'sine',.085,390-i*25)}
  function boing(t){tone(180,t,.65,'sawtooth',.07,720);tone(520,t+.18,.22,'triangle',.08,260)}
  function playSequence(){
    if(!running||!ctx||!master)return;
    const n=ctx.currentTime+.08;
    laugh(n);cry(n+1.8);boing(n+4);laugh(n+5.1);cry(n+7);boing(n+9.2);
    timer=setTimeout(playSequence,11500);
  }
  document.getElementById('start').addEventListener('click',async()=>{
    if(running)return;
    try{
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      await ctx.resume();
      master=ctx.createGain();master.gain.value=.75;master.connect(ctx.destination);
      running=true;playSequence();
    }catch(e){running=false;}
  });
  document.getElementById('stop').addEventListener('click',()=>{
    running=false;
    if(timer!==null){clearTimeout(timer);timer=null;}
    if(ctx){ctx.close();ctx=null;master=null;}
  });
})();
</script>
</body>
</html>
